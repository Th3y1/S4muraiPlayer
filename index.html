<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S4murai Player</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --card-bg: #1f2937;
            --accent-red: #ef4444;
            --accent-red-hover: #dc2626;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #374151;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(17, 24, 39, 0.85);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            font-style: italic;
            color: var(--accent-red);
            letter-spacing: 1px;
            cursor: pointer;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-red), #b91c1c);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
        }

        .btn-secondary {
            background: var(--card-bg);
            box-shadow: none;
        }
        .btn-secondary:hover {
            background: #374151;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Baner ogłoszenia */
        .announcement-banner {
            background: linear-gradient(90deg, var(--card-bg), var(--panel-bg));
            border-left: 4px solid var(--accent-red);
            padding: 15px 25px;
            margin-bottom: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .announcement-banner img {
            max-height: 70px;
            max-width: 120px;
            border-radius: 6px;
            object-fit: cover;
        }
        .announcement-content strong {
            color: var(--accent-red);
            display: block;
            margin-bottom: 4px;
        }

        /* Sekcja główna / Katalog */
        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
            color: var(--text-main);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .serials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .serial-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .serial-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-red);
        }

        .serial-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #000;
        }

        .serial-info {
            padding: 15px;
        }

        .serial-info h4 {
            font-size: 16px;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .serial-info span {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Widok Odtwarzacza */
        #player-view {
            display: none;
        }

        .player-container {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .video-wrapper iframe, .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .episodes-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .ep-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .ep-btn:hover, .ep-btn.active {
            background: var(--accent-red);
            border-color: var(--accent-red);
        }

        /* Nowoczesny Panel Admina */
        .admin-view {
            display: none;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-top: 20px;
        }

        .admin-view h2 {
            color: var(--accent-red);
            margin-bottom: 25px;
            font-size: 22px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .form-section h3 {
            font-size: 15px;
            margin-bottom: 15px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        input, select, textarea {
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-red);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="showCatalog()">S4MURAI PLAYER</div>
        <div class="nav-buttons">
            <button class="btn btn-secondary" onclick="window.open('https://discord.com', '_blank')">DISCORD</button>
            <button class="btn" id="admin-toggle-btn" onclick="toggleAdminPanel()">PANEL ADMINA</button>
        </div>
    </header>

    <div class="container">
        <!-- Baner ogłoszenia globalnego -->
        <div id="announcement-wrapper" class="announcement-banner" style="display: none;">
            <div id="announcement-img-container"></div>
            <div class="announcement-content">
                <strong>Ogłoszenie specjalne:</strong>
                <span id="global-announcement-text"></span>
            </div>
        </div>

        <!-- WIDOK KATALOGU -->
        <div id="catalog-view">
            <h3 class="section-title">Dostępne Seriale</h3>
            <div id="serials-grid" class="serials-grid">
                <!-- Ładowane dynamicznie -->
            </div>
        </div>

        <!-- WIDOK ODTWARZACZA -->
        <div id="player-view">
            <button class="btn btn-secondary" style="margin-bottom: 15px;" onclick="showCatalog()">← Powrót do katalogu</button>
            <div class="player-container">
                <h2 id="player-serial-title" style="margin-bottom: 15px;">Tytuł Serialu</h2>
                <div class="video-wrapper">
                    <iframe id="video-frame" src="" allowfullscreen></iframe>
                </div>
                <h4 style="margin-bottom: 10px; font-size: 14px; color: var(--text-muted);">Odcinki:</h4>
                <div id="episodes-container" class="episodes-list">
                    <!-- Przyciski odcinków -->
                </div>
            </div>
        </div>

        <!-- PANEL ZARZĄDZANIA (ADMIN) -->
        <div id="admin-panel" class="admin-view">
            <h2>Panel Zarządzania</h2>

            <div class="form-section">
                <h3>Edytuj ogłoszenie główne</h3>
                <div class="form-group">
                    <label>Treść ogłoszenia</label>
                    <input type="text" id="admin-announcement-input" placeholder="Wpisz treść...">
                </div>
                <div class="form-group">
                    <label>Link do zdjęcia ogłoszenia (URL)</label>
                    <input type="text" id="admin-announcement-img" placeholder="https://...">
                </div>
                <button class="btn" onclick="updateAnnouncement()">Zapisz ogłoszenie</button>
            </div>

            <div class="form-section">
                <h3>Dodaj nowy serial</h3>
                <div class="row">
                    <div class="form-group">
                        <label>Tytuł serialu</label>
                        <input type="text" id="new-serial-title" placeholder="np. Tytuł serii...">
                    </div>
                    <div class="form-group">
                        <label>Kategoria</label>
                        <input type="text" id="new-serial-category" placeholder="np. Akcja, Romans">
                    </div>
                </div>
                <div class="form-group">
                    <label>Link do okładki (URL)</label>
                    <input type="text" id="new-serial-image" placeholder="https://...">
                </div>
                <button class="btn" onclick="addSerial()">Dodaj serial</button>
            </div>

            <div class="form-section">
                <h3>Dodaj odcinek do serialu</h3>
                <div class="form-group">
                    <label>Wybierz serial</label>
                    <select id="episode-serial-select">
                        <option value="">Wybierz serial...</option>
                    </select>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>Nazwa / Numer odcinka</label>
                        <input type="text" id="episode-name" placeholder="np. Odcinek 1">
                    </div>
                    <div class="form-group">
                        <label>Link do odtwarzacza lub YouTube</label>
                        <input type="text" id="episode-link" placeholder="https://...">
                    </div>
                </div>
                <button class="btn" onclick="addEpisode()">Dodaj odcinek</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'TUTAJ_WKLEJ_SWOJ_URL';
        const SUPABASE_ANON_KEY = 'TUTAJ_WKLEJ_SWOJ_KLUCZ';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isAdminOpen = false;

        function toggleAdminPanel() {
            isAdminOpen = !isAdminOpen;
            document.getElementById('admin-panel').style.display = isAdminOpen ? 'block' : 'none';
            document.getElementById('admin-toggle-btn').textContent = isAdminOpen ? 'ZAMKNIJ PANEL' : 'PANEL ADMINA';
            if (isAdminOpen) {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }
        }

        async function loadCatalog() {
            const { data, error } = await supabaseClient.from('S4muraiPlayer').select('*');
            const grid = document.getElementById('serials-grid');
            grid.innerHTML = '';

            if (data) {
                data.forEach(item => {
                    if (item.title === '_GLOBAL_CONFIG_') return;

                    const card = document.createElement('div');
                    card.className = 'serial-card';
                    card.onclick = () => openPlayer(item);

                    card.innerHTML = `
                        <img src="${item.image || ''}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/220x280?text=Brak+Okładki'">
                        <div class="serial-info">
                            <h4>${item.title}</h4>
                            <span>${item.category || 'Inne'}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        }

        function openPlayer(serial) {
            document.getElementById('catalog-view').style.display = 'none';
            document.getElementById('player-view').style.display = 'block';
            document.getElementById('player-serial-title').textContent = serial.title;

            let episodes = [];
            try {
                episodes = JSON.parse(serial.episodes || '[]');
            } catch {
                episodes = [];
            }

            const epContainer = document.getElementById('episodes-container');
            epContainer.innerHTML = '';

            const iframe = document.getElementById('video-frame');

            if (episodes.length > 0) {
                iframe.src = episodes[0].link || '';
                episodes.forEach((ep, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'ep-btn' + (index === 0 ? ' active' : '');
                    btn.textContent = ep.title;
                    btn.onclick = () => {
                        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        iframe.src = ep.link;
                    };
                    epContainer.appendChild(btn);
                });
            } else {
                iframe.src = '';
                epContainer.innerHTML = '<span style="color:var(--text-muted)">Brak odcinków w tym serialu.</span>';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showCatalog() {
            document.getElementById('player-view').style.display = 'none';
            document.getElementById('catalog-view').style.display = 'block';
            loadCatalog();
        }

        async function updateAnnouncement() {
            const newText = document.getElementById('admin-announcement-input').value;
            const newImg = document.getElementById('admin-announcement-img').value;

            if (!newText) {
                alert('Treść ogłoszenia nie może być pusta!');
                return;
            }

            const payloadData = JSON.stringify({ text: newText, img: newImg });

            try {
                const { data } = await supabaseClient
                    .from('S4muraiPlayer')
                    .select('title')
                    .eq('title', '_GLOBAL_CONFIG_')
                    .single();

                let error;
                if (data) {
                    const res = await supabaseClient
                        .from('S4muraiPlayer')
                        .update({ category: payloadData })
                        .eq('title', '_GLOBAL_CONFIG_');
                    error = res.error;
                } else {
                    const res = await supabaseClient
                        .from('S4muraiPlayer')
                        .insert([{ title: '_GLOBAL_CONFIG_', category: payloadData, episodes: '[]' }]);
                    error = res.error;
                }

                if (error) throw error;
                loadAnnouncement();
                alert('Ogłoszenie zaktualizowane!');
            } catch (err) {
                alert('Błąd: ' + err.message);
            }
        }

        async function loadAnnouncement() {
            try {
                const { data } = await supabaseClient
                    .from('S4muraiPlayer')
                    .select('category')
                    .eq('title', '_GLOBAL_CONFIG_')
                    .single();

                if (data && data.category) {
                    let bannerData;
                    try {
                        bannerData = JSON.parse(data.category);
                    } catch {
                        bannerData = { text: data.category, img: '' };
                    }

                    if (bannerData.text) {
                        document.getElementById('global-announcement-text').textContent = bannerData.text;
                        const imgContainer = document.getElementById('announcement-img-container');
                        imgContainer.innerHTML = bannerData.img ? `<img src="${bannerData.img}" alt="Obrazek">` : '';
                        document.getElementById('announcement-wrapper').style.display = 'flex';
                    }
                }
            } catch (e) {}
        }

        async function loadSerialsSelect() {
            const { data } = await supabaseClient.from('S4muraiPlayer').select('title');
            const select = document.getElementById('episode-serial-select');
            select.innerHTML = '<option value="">Wybierz serial...</option>';
            if (data) {
                data.forEach(item => {
                    if (item.title !== '_GLOBAL_CONFIG_') {
                        const opt = document.createElement('option');
                        opt.value = item.title;
                        opt.textContent = item.title;
                        select.appendChild(opt);
                    }
                });
            }
        }

        async function addSerial() {
            const title = document.getElementById('new-serial-title').value;
            const category = document.getElementById('new-serial-category').value;
            const image = document.getElementById('new-serial-image').value;

            if (!title) {
                alert('Podaj tytuł serialu!');
                return;
            }

            const { error } = await supabaseClient
                .from('S4muraiPlayer')
                .insert([{ title, category, image, episodes: JSON.stringify([]) }]);

            if (error) {
                alert('Błąd: ' + error.message);
            } else {
                alert('Serial dodany pomyślnie!');
                loadSerialsSelect();
                loadCatalog();
            }
        }

        async function addEpisode() {
            const serialTitle = document.getElementById('episode-serial-select').value;
            const epName = document.getElementById('episode-name').value;
            const epLink = document.getElementById('episode-link').value;

            if (!serialTitle || !epName) {
                alert('Wybierz serial i podaj nazwę odcinka!');
                return;
            }

            const { data, error } = await supabaseClient
                .from('S4muraiPlayer')
                .select('episodes')
                .eq('title', serialTitle)
                .single();

            if (error) {
                alert('Nie znaleziono serialu.');
                return;
            }

            let episodesList = [];
            try {
                episodesList = JSON.parse(data.episodes || '[]');
            } catch {
                episodesList = [];
            }

            episodesList.push({ title: epName, link: epLink });

            const { error: updateError } = await supabaseClient
                .from('S4muraiPlayer')
                .update({ episodes: JSON.stringify(episodesList) })
                .eq('title', serialTitle);

            if (updateError) {
                alert('Błąd: ' + updateError.message);
            } else {
                alert('Odcinek dodany pomyślnie!');
            }
        }

        window.onload = () => {
            loadAnnouncement();
            loadCatalog();
            loadSerialsSelect();
        };
    </script>
</body>
</html>
