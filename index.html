<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S4muraiPlayer</title>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2a2a2a;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 {
            color: #e50914;
            margin: 0;
        }
        .dev-btn {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .dev-btn:hover {
            background: #e50914;
            border-color: #e50914;
        }
        /* Panel Dev */
        #dev-panel {
            display: none;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            margin-bottom: 30px;
            border: 1px solid #333;
        }
        .admin-section {
            background: #252525;
            padding: 15px;
            margin-top: 15px;
            border-radius: 6px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button.action-btn {
            width: 100%;
            padding: 10px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        button.action-btn:hover {
            background: #b20710;
        }
        /* Kategorie - Filtry */
        .categories-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .cat-chip {
            background: #1e1e1e;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .cat-chip:hover, .cat-chip.active {
            background: #e50914;
            border-color: #e50914;
        }
        /* Siatka Anime */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .anime-card {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
        }
        .anime-card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }
        .anime-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .anime-title {
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }
        .anime-cat {
            color: #888;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .episodes-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: auto;
        }
        .ep-btn {
            background: #2a2a2a;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 13px;
            border: 1px solid #444;
            transition: 0.2s;
        }
        .ep-btn:hover {
            background: #e50914;
            border-color: #e50914;
        }
        #error-msg {
            color: #ff5555;
            background: #331111;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            white-space: pre-wrap;
            font-family: monospace;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>S4muraiPlayer</h1>
        <button class="dev-btn" onclick="toggleDevPanel()">Dev Panel</button>
    </header>

    <div id="error-msg"></div>

    <!-- PANEL ADMINISTRATORA (DEV) -->
    <div id="dev-panel">
        <h2>Panel Zarządzania (Dev)</h2>
        
        <!-- 1. Dodawanie nowego serialu -->
        <div class="admin-section">
            <h3>Dodaj Nowy Serial</h3>
            <input type="text" id="new-anime-title" placeholder="Tytuł serialu (np. Solo Leveling)">
            <select id="new-anime-category">
                <option value="Akcja">Akcja</option>
                <option value="Romans">Romans</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Inne">Inne</option>
            </select>
            <input type="text" id="new-anime-image" placeholder="Link do okładki (URL obrazka)">
            <button class="action-btn" onclick="addAnimeShow()">Utwórz Serial</button>
        </div>

        <!-- 2. Dodawanie odcinka do serialu -->
        <div class="admin-section">
            <h3>Dodaj Odcinek do Serialu</h3>
            <select id="ep-anime-select">
                <option value="">Wybierz serial...</option>
            </select>
            <input type="text" id="ep-number" placeholder="Numer lub nazwa odcinka (np. Odcinek 1)">
            <input type="text" id="ep-link" placeholder="Link do odtwarzacza / wideo">
            <button class="action-btn" onclick="addEpisode()">Dodaj Odcinek</button>
        </div>

        <!-- 3. Edycja nazwy / okładki / kategorii serialu -->
        <div class="admin-section">
            <h3>Edytuj Istniejący Serial</h3>
            <select id="edit-anime-select" onchange="loadEditData()">
                <option value="">Wybierz serial do edycji...</option>
            </select>
            <input type="text" id="edit-anime-title" placeholder="Nowy tytuł">
            <select id="edit-anime-category">
                <option value="Akcja">Akcja</option>
                <option value="Romans">Romans</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Inne">Inne</option>
            </select>
            <input type="text" id="edit-anime-image" placeholder="Nowy link do okładki">
            <button class="action-btn" onclick="updateAnimeShow()">Zapisz Zmiany</button>
        </div>
    </div>

    <!-- Pasek Kategorii -->
    <div class="categories-bar">
        <button class="cat-chip active" onclick="filterCategory('Wszystkie', this)">Wszystkie</button>
        <button class="cat-chip" onclick="filterCategory('Akcja', this)">Akcja</button>
        <button class="cat-chip" onclick="filterCategory('Romans', this)">Romans</button>
        <button class="cat-chip" onclick="filterCategory('Fantasy', this)">Fantasy</button>
        <button class="cat-chip" onclick="filterCategory('Inne', this)">Inne</button>
    </div>

    <!-- Katalog Anime -->
    <div>
        <div id="anime-grid" class="anime-grid">Ładowanie katalogu...</div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://dmxjcgriqxsxcsvxihed.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRteGpjZ3JpcXhzeGNzdnhpaGVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyOTA1MzAsImV4cCI6MjEwNDg2NjUzMH0.nFoD44in459L7M5mUxSXcojWGP89PbGdhRrTAz8ZbfI';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let allAnimeData = [];
    let currentCategory = 'Wszystkie';

    function toggleDevPanel() {
        const panel = document.getElementById('dev-panel');
        if (panel.style.display === 'block') {
            panel.style.display = 'none';
        } else {
            const pass = prompt('Podaj hasło administratora:');
            if (pass === 'Korneliusz1111') {
                panel.style.display = 'block';
                populateSelects();
            } else if (pass !== null) {
                alert('Błędne hasło!');
            }
        }
    }

    async function fetchAnime() {
        const errorDiv = document.getElementById('error-msg');
        const gridDiv = document.getElementById('anime-grid');
        errorDiv.style.display = 'none';
        
        try {
            const { data, error } = await supabaseClient
                .from('S4muraiPlayer')
                .select('*');

            if (error) throw error;

            allAnimeData = data || [];
            renderAnime();
            populateSelects();

        } catch (err) {
            console.error(err);
            errorDiv.style.display = 'block';
            errorDiv.textContent = 'Błąd pobierania danych:\n' + (err.message || JSON.stringify(err, null, 2));
            gridDiv.innerHTML = '';
        }
    }

    function filterCategory(cat, element) {
        currentCategory = cat;
        document.querySelectorAll('.cat-chip').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        renderAnime();
    }

    function renderAnime() {
        const gridDiv = document.getElementById('anime-grid');
        
        const filtered = currentCategory === 'Wszystkie' 
            ? allAnimeData 
            : allAnimeData.filter(a => a.category === currentCategory);

        if (filtered.length === 0) {
            gridDiv.innerHTML = '<p style="color: #888;">Brak seriali w tej kategorii.</p>';
            return;
        }

        let html = '';
        filtered.forEach(anime => {
            // Super-bezpieczne parsowanie odcinków (zabezpieczenie przed null, obiektami lub stringami)
            let eps = [];
            try {
                if (Array.isArray(anime.episodes)) {
                    eps = anime.episodes;
                } else if (typeof anime.episodes === 'string' && anime.episodes.trim() !== '') {
                    const parsed = JSON.parse(anime.episodes);
                    if (Array.isArray(parsed)) eps = parsed;
                }
            } catch(e) {
                eps = [];
            }

            let episodesHtml = '';
            if (eps.length === 0) {
                episodesHtml = '<span style="color: #666; font-size: 13px;">Brak odcinków</span>';
            } else {
                eps.forEach(ep => {
                    if (ep && ep.title && ep.link) {
                        episodesHtml += `<a href="${ep.link}" target="_blank" class="ep-btn">${ep.title}</a>`;
                    }
                });
            }

            html += `
                <div class="anime-card">
                    <img src="${anime.image || 'https://via.placeholder.com/280x350?text=Brak+Okladki'}" alt="Okładka">
                    <div class="anime-info">
                        <div class="anime-title">${anime.title}</div>
                        <div class="anime-cat">Kategoria: ${anime.category || 'Inne'}</div>
                        <div class="episodes-list">
                            ${episodesHtml}
                        </div>
                    </div>
                </div>
            `;
        });
        gridDiv.innerHTML = html;
    }

    function populateSelects() {
        const epSelect = document.getElementById('ep-anime-select');
        const editSelect = document.getElementById('edit-anime-select');
        
        let options = '<option value="">Wybierz serial...</option>';
        allAnimeData.forEach(anime => {
            options += `<option value="${anime.id}">${anime.title}</option>`;
        });
        
        epSelect.innerHTML = options;
        editSelect.innerHTML = options;
    }

    async function addAnimeShow() {
        const title = document.getElementById('new-anime-title').value;
        const category = document.getElementById('new-anime-category').value;
        const image = document.getElementById('new-anime-image').value;

        if (!title) {
            alert('Wprowadź tytuł serialu!');
            return;
        }

        const { error } = await supabaseClient
            .from('S4muraiPlayer')
            .insert([{ title, category, image, episodes: [] }]);

        if (error) {
            alert('Błąd: ' + error.message);
        } else {
            alert('Serial dodany pomyślnie!');
            document.getElementById('new-anime-title').value = '';
            document.getElementById('new-anime-image').value = '';
            fetchAnime();
        }
    }

    async function addEpisode() {
        const animeId = document.getElementById('ep-anime-select').value;
        const epTitle = document.getElementById('ep-number').value;
        const epLink = document.getElementById('ep-link').value;

        if (!animeId || !epTitle || !epLink) {
            alert('Wypełnij wszystkie pola odcinka!');
            return;
        }

        const animeObj = allAnimeData.find(a => a.id == animeId);
        if (!animeObj) return;

        let eps = [];
        try {
            if (Array.isArray(animeObj.episodes)) {
                eps = animeObj.episodes;
            } else if (typeof animeObj.episodes === 'string' && animeObj.episodes.trim() !== '') {
                const parsed = JSON.parse(animeObj.episodes);
                if (Array.isArray(parsed)) eps = parsed;
            }
        } catch(e) { eps = []; }

        eps.push({ title: epTitle, link: epLink });

        const { error } = await supabaseClient
            .from('S4muraiPlayer')
            .update({ episodes: eps })
            .eq('id', animeId);

        if (error) {
            alert('Błąd dodawania odcinka: ' + error.message);
        } else {
            alert('Odcinek dodany pomyślnie!');
            document.getElementById('ep-number').value = '';
            document.getElementById('ep-link').value = '';
            fetchAnime();
        }
    }

    function loadEditData() {
        const animeId = document.getElementById('edit-anime-select').value;
        if (!animeId) {
            document.getElementById('edit-anime-title').value = '';
            document.getElementById('edit-anime-image').value = '';
            return;
        }
        const animeObj = allAnimeData.find(a => a.id == animeId);
        if (animeObj) {
            document.getElementById('edit-anime-title').value = animeObj.title || '';
            document.getElementById('edit-anime-image').value = animeObj.image || '';
            document.getElementById('edit-anime-category').value = animeObj.category || 'Inne';
        }
    }

    async function updateAnimeShow() {
        const animeId = document.getElementById('edit-anime-select').value;
        const newTitle = document.getElementById('edit-anime-title').value;
        const newImage = document.getElementById('edit-anime-image').value;
        const newCat = document.getElementById('edit-anime-category').value;

        if (!animeId || !newTitle) {
            alert('Wybierz serial i podaj tytuł!');
            return;
        }

        const { error } = await supabaseClient
            .from('S4muraiPlayer')
            .update({ title: newTitle, image: newImage, category: newCat })
            .eq('id', animeId);

        if (error) {
            alert('Błąd edycji: ' + error.message);
        } else {
            alert('Serial zaktualizowany pomyślnie!');
            fetchAnime();
        }
    }

    fetchAnime();
</script>

</body>
</html>
