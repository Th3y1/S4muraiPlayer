<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S4muraiPlayer</title>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1, h2 {
            color: #ffffff;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #b20710;
        }
        .anime-card {
            background: #2a2a2a;
            padding: 15px;
            margin-top: 15px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .anime-card img {
            width: 80px;
            height: 110px;
            object-fit: cover;
            border-radius: 4px;
        }
        #error-msg {
            color: #e50914;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>S4muraiPlayer</h1>

    <!-- Panel Administratora -->
    <div style="margin-bottom: 30px;">
        <h2>Panel Administratora</h2>
        <input type="password" id="admin-pass" placeholder="Hasło administratora">
        <input type="text" id="anime-title" placeholder="Tytuł anime (np. Solo Leveling)">
        <select id="anime-category">
            <option value="Akcja">Akcja</option>
            <option value="Romans">Romans</option>
            <option value="Fantasy">Fantasy</option>
            <option value="Inne">Inne</option>
        </select>
        <input type="text" id="anime-image" placeholder="Link do miniatury (obrazka URL)">
        <input type="text" id="anime-episodes" placeholder="Link do odtwarzacza / odcinka">
        <button onclick="addAnime()">Dodaj Anime dla wszystkich</button>
    </div>

    <!-- Katalog Anime -->
    <div>
        <h2>Katalog Anime</h2>
        <div id="error-msg"></div>
        <div id="anime-list">Ładowanie katalogu...</div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://dmxjcgriqxsxcsvxihed.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRteGpjZ3JpcXhzeGNzdnhpaGVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyOTA1MzAsImV4cCI6MjEwNDg2NjUzMH0.nFoD44in459L7M5mUxSXcojWGP89PbGdhRrTAz8ZbfI';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function fetchAnime() {
        const errorDiv = document.getElementById('error-msg');
        const listDiv = document.getElementById('anime-list');
        
        errorDiv.textContent = '';
        
        try {
            const { data, error } = await supabaseClient
                .from('S4muraiPlayer')
                .select('*');

            if (error) throw error;

            if (!data || data.length === 0) {
                listDiv.innerHTML = '<p>Brak dodanych anime w bazie.</p>';
                return;
            }

            let html = '';
            data.forEach(anime => {
                html += `
                    <div class="anime-card">
                        <img src="${anime.image || 'https://via.placeholder.com/80x110?text=Brak'}" alt="Miniatura">
                        <div>
                            <h3 style="margin: 0 0 5px 0;">${anime.title}</h3>
                            <p style="margin: 0 0 10px 0; color: #aaa; font-size: 14px;">Kategoria: ${anime.category || 'Brak'}</p>
                            <a href="${anime.episodes}" target="_blank" style="color: #e50914; text-decoration: none; font-weight: bold;">Oglądaj odcinek &rarr;</a>
                        </div>
                    </div>
                `;
            });
            listDiv.innerHTML = html;

        } catch (err) {
            errorDiv.textContent = 'Błąd pobierania: ' + err.message;
            listDiv.innerHTML = '';
        }
    }

    async function addAnime() {
        const pass = document.getElementById('admin-pass').value;
        const title = document.getElementById('anime-title').value;
        const category = document.getElementById('anime-category').value;
        const image = document.getElementById('anime-image').value;
        const episodes = document.getElementById('anime-episodes').value;

        if (pass !== 'Korneliusz1111') {
            alert('Błędne hasło administratora!');
            return;
        }

        if (!title || !episodes) {
            alert('Wypełnij przynajmniej tytuł oraz link do odcinka!');
            return;
        }

        const { error } = await supabaseClient
            .from('S4muraiPlayer')
            .insert([{ title, category, image, episodes }]);

        if (error) {
            alert('Błąd podczas dodawania: ' + error.message);
        } else {
            alert('Anime zostało dodane pomyślnie!');
            document.getElementById('anime-title').value = '';
            document.getElementById('anime-image').value = '';
            document.getElementById('anime-episodes').value = '';
            document.getElementById('admin-pass').value = '';
            fetchAnime();
        }
    }

    fetchAnime();
</script>

</body>
</html>
