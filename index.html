<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S4murai Player</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --accent-red: #ef4444;
            --accent-red-hover: #dc2626;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(17, 24, 39, 0.8);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            font-style: italic;
            color: var(--accent-red);
            letter-spacing: 1px;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-red), #b91c1c);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
        }

        .btn-secondary {
            background: #1f2937;
            box-shadow: none;
        }
        .btn-secondary:hover {
            background: #374151;
        }

        /* Banner ogłoszenia */
        .announcement-banner {
            background: linear-gradient(90deg, #1f2937, #111827);
            border-left: 4px solid var(--accent-red);
            padding: 15px 40px;
            margin: 20px 40px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .announcement-banner img {
            max-height: 60px;
            border-radius: 4px;
            object-fit: cover;
        }

        /* Główny kontener / Panel Admina */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .admin-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .admin-panel h2 {
            color: var(--accent-red);
            margin-bottom: 25px;
            font-size: 22px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-section {
            margin-bottom: 25px;
        }

        .form-section h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: var(--text-muted);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        label {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        input, select, textarea {
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-red);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">S4MURAI PLAYER</div>
        <div class="nav-buttons">
            <button class="btn btn-secondary" onclick="window.open('https://discord.com', '_blank')">DISCORD</button>
            <button class="btn" onclick="toggleAdminPanel()">PANEL ADMINA</button>
        </div>
    </header>

    <!-- Baner ogłoszenia globalnego -->
    <div id="announcement-wrapper" class="announcement-banner" style="display: none;">
        <div id="announcement-img-container"></div>
        <div>
            <strong>Ogłoszenie:</strong>
            <span id="global-announcement-text">Brak ogłoszeń</span>
        </div>
    </div>

    <div class="container">
        <!-- Panel Zarządzania (Admin Panel) -->
        <div class="admin-panel">
            <h2>Panel Zarządzania</h2>

            <!-- EDYTUJ OGŁOSZENIE -->
            <div class="form-section">
                <h3>Edytuj ogłoszenie główne</h3>
                <div class="form-group">
                    <label>Treść ogłoszenia</label>
                    <input type="text" id="admin-announcement-input" placeholder="Wpisz treść ogłoszenia...">
                </div>
                <div class="form-group">
                    <label>Link do zdjęcia ogłoszenia (opcjonalnie)</label>
                    <input type="text" id="admin-announcement-img" placeholder="https://...">
                </div>
                <button class="btn" onclick="updateAnnouncement()">Zapisz ogłoszenie</button>
            </div>

            <!-- DODAJ NOWY SERIAL -->
            <div class="form-section">
                <h3>Dodaj nowy serial</h3>
                <div class="row">
                    <div class="form-group">
                        <label>Tytuł serialu</label>
                        <input type="text" id="new-serial-title" placeholder="np. Tytuł serii...">
                    </div>
                    <div class="form-group">
                        <label>Kategoria</label>
                        <input type="text" id="new-serial-category" placeholder="np. Akcja, Romans">
                    </div>
                </div>
                <div class="form-group">
                    <label>Link do okładki (URL)</label>
                    <input type="text" id="new-serial-image" placeholder="https://...">
                </div>
                <button class="btn" onclick="addSerial()">Dodaj serial</button>
            </div>

            <!-- DODAJ ODCINEK -->
            <div class="form-section">
                <h3>Dodaj odcinek do serialu</h3>
                <div class="form-group">
                    <label>Wybierz serial</label>
                    <select id="episode-serial-select">
                        <option value="">Wybierz serial...</option>
                    </select>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>Nazwa / Numer odcinka</label>
                        <input type="text" id="episode-name" placeholder="np. Odcinek 1">
                    </div>
                    <div class="form-group">
                        <label>Link do odtwarzacza lub YouTube</label>
                        <input type="text" id="episode-link" placeholder="https://...">
                    </div>
                </div>
                <button class="btn" onclick="addEpisode()">Dodaj odcinek</button>
            </div>
        </div>
    </div>

    <script>
        // --- TUTAJ WKLEJ SWOJE DANE SUPABASE ---
        const SUPABASE_URL = 'TUTAJ_WKLEJ_SWOJ_URL';
        const SUPABASE_ANON_KEY = 'TUTAJ_WKLEJ_SWOJ_KLUCZ';
        
        // Inicjalizacja klienta Supabase
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Funkcja aktualizacji ogłoszenia (zapisująca w kolumnie category jako JSON lub tekst z linkiem)
        async function updateAnnouncement() {
            const newText = document.getElementById('admin-announcement-input').value;
            const newImg = document.getElementById('admin-announcement-img').value;

            if (!newText) {
                alert('Treść ogłoszenia nie może być pusta!');
                return;
            }

            // Łączymy tekst i obrazek jako prosty JSON string w kolumnie category
            const payloadData = JSON.stringify({ text: newText, img: newImg });

            try {
                const { data } = await supabaseClient
                    .from('S4muraiPlayer')
                    .select('title')
                    .eq('title', '_GLOBAL_CONFIG_')
                    .single();

                let error;
                if (data) {
                    const res = await supabaseClient
                        .from('S4muraiPlayer')
                        .update({ category: payloadData })
                        .eq('title', '_GLOBAL_CONFIG_');
                    error = res.error;
                } else {
                    const res = await supabaseClient
                        .from('S4muraiPlayer')
                        .insert([{ title: '_GLOBAL_CONFIG_', category: payloadData, episodes: '[]' }]);
                    error = res.error;
                }

                if (error) throw error;

                loadAnnouncement();
                alert('Ogłoszenie zostało zaktualizowane pomyślnie!');
            } catch (err) {
                alert('Błąd aktualizacji ogłoszenia: ' + err.message);
            }
        }

        async function loadAnnouncement() {
            try {
                const { data, error } = await supabaseClient
                    .from('S4muraiPlayer')
                    .select('category')
                    .eq('title', '_GLOBAL_CONFIG_')
                    .single();

                if (data && data.category) {
                    let bannerData;
                    try {
                        bannerData = JSON.parse(data.category);
                    } catch {
                        bannerData = { text: data.category, img: '' };
                    }

                    if (bannerData.text) {
                        document.getElementById('global-announcement-text').textContent = bannerData.text;
                        const imgContainer = document.getElementById('announcement-img-container');
                        imgContainer.innerHTML = bannerData.img ? `<img src="${bannerData.img}" alt="Obrazek ogłoszenia">` : '';
                        document.getElementById('announcement-wrapper').style.display = 'flex';
                    }
                }
            } catch (e) {
                console.log('Brak aktywnego ogłoszenia.');
            }
        }

        async function loadSerialsList() {
            const { data, error } = await supabaseClient.from('S4muraiPlayer').select('title');
            const select = document.getElementById('episode-serial-select');
            select.innerHTML = '<option value="">Wybierz serial...</option>';
            if (data) {
                data.forEach(item => {
                    if (item.title !== '_GLOBAL_CONFIG_') {
                        const opt = document.createElement('option');
                        opt.value = item.title;
                        opt.textContent = item.title;
                        select.appendChild(opt);
                    }
                });
            }
        }

        async function addSerial() {
            const title = document.getElementById('new-serial-title').value;
            const category = document.getElementById('new-serial-category').value;
            const image = document.getElementById('new-serial-image').value;

            if (!title) {
                alert('Podaj tytuł serialu!');
                return;
            }

            const { error } = await supabaseClient
                .from('S4muraiPlayer')
                .insert([{ title, category, image, episodes: JSON.stringify([]) }]);

            if (error) {
                alert('Błąd: ' + error.message);
            } else {
                alert('Serial dodany pomyślnie!');
                loadSerialsList();
            }
        }

        async function addEpisode() {
            const serialTitle = document.getElementById('episode-serial-select').value;
            const epName = document.getElementById('episode-name').value;
            const epLink = document.getElementById('episode-link').value;

            if (!serialTitle || !epName) {
                alert('Wybierz serial i podaj nazwę odcinka!');
                return;
            }

            const { data, error } = await supabaseClient
                .from('S4muraiPlayer')
                .select('episodes')
                .eq('title', serialTitle)
                .single();

            if (error) {
                alert('Nie znaleziono serialu.');
                return;
            }

            let episodesList = [];
            try {
                episodesList = JSON.parse(data.episodes || '[]');
            } catch {
                episodesList = [];
            }

            episodesList.push({ title: epName, link: epLink });

            const { error: updateError } = await supabaseClient
                .from('S4muraiPlayer')
                .update({ episodes: JSON.stringify(episodesList) })
                .eq('title', serialTitle);

            if (updateError) {
                alert('Błąd dodawania odcinka: ' + updateError.message);
            } else {
                alert('Odcinek dodany pomyślnie!');
            }
        }

        function toggleAdminPanel() {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        // Uruchomienie przy starcie
        window.onload = () => {
            loadAnnouncement();
            loadSerialsList();
        };
    </script>
</body>
</html>
