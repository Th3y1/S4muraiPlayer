<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S4muraiPlayer</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f13;
            color: #ffffff;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #22222e;
            padding-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .logo span {
            color: #ff3366;
            display: block;
            font-size: 18px;
        }

        .header-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .discord-btn {
            background-color: #5865F2;
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        .discord-btn:hover {
            background-color: #4752C4;
        }

        .dev-btn {
            background-color: #ff3366;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        .dev-btn:hover {
            background-color: #e02c58;
        }

        .categories {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .cat-chip {
            background-color: #1a1a24;
            border: 1px solid #2d2d3d;
            color: #ccc;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }

        .cat-chip:hover, .cat-chip.active {
            background-color: #ff3366;
            border-color: #ff3366;
            color: white;
        }

        .search-box {
            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;
            max-width: 400px;
            background-color: #16161f;
            border: 1px solid #2d2d3d;
            padding: 10px 15px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .anime-card {
            background-color: #16161f;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #22222e;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .anime-card:hover {
            border-color: #ff3366;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255, 51, 102, 0.2);
        }

        .anime-card img {
            width: 100%;
            height: 330px;
            object-fit: cover;
        }

        .anime-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .anime-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .anime-cat {
            font-size: 12px;
            color: #ff3366;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Widok Odtwarzacza i Animacje */
        .view-section {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .hidden {
            display: none !important;
            opacity: 0;
            transform: scale(0.98);
        }

        .visible {
            display: block !important;
            opacity: 1;
            transform: scale(1);
        }

        .series-header-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            border-left: 4px solid #ff3366;
            padding-left: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .player-container {
            background-color: #16161f;
            border: 1px solid #2d2d3d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .video-frame-wrap {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Proporcje 16:9 */
            height: 0;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .video-frame-wrap iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .episodes-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .ep-select-btn {
            background-color: #1f1f2e;
            color: #ddd;
            border: 1px solid #2d2d3d;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        .ep-select-btn:hover, .ep-select-btn.active {
            background-color: #ff3366;
            border-color: #ff3366;
            color: white;
        }

        .back-btn {
            background-color: #1f1f2e;
            color: #fff;
            border: 1px solid #2d2d3d;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        .back-btn:hover {
            background-color: #2d2d3d;
        }

        /* Panel Administratora */
        #dev-panel {
            display: none;
            background-color: #16161f;
            border: 1px solid #ff3366;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        #dev-panel h2 {
            color: #ff3366;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .admin-section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #22222e;
        }

        .admin-section:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .admin-section h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #aaa;
        }

        .form-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .form-group input, .form-group select {
            background-color: #0f0f13;
            border: 1px solid #2d2d3d;
            padding: 8px 12px;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            flex-grow: 1;
            min-width: 150px;
        }

        .admin-btn {
            background-color: #ff3366;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .admin-btn:hover {
            background-color: #e02c58;
        }

        .error-box {
            background-color: #3d1a1a;
            border: 1px solid #ff3366;
            color: #ff9999;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            white-space: pre-wrap;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">S4murai <span>Player</span></div>
        <div class="header-right">
            <a href="https://discord.gg/M6uy839mk" target="_blank" class="discord-btn">DISCORD</a>
            <button class="dev-btn" onclick="toggleDevPanel()">PANEL ADMINA</button>
        </div>
    </header>

    <div id="error-box" class="error-box"></div>

    <!-- PANEL ADMINA -->
    <div id="dev-panel">
        <h2>Panel Zarządzania</h2>

        <!-- Dodaj serial -->
        <div class="admin-section">
            <h3>Dodaj nowy serial</h3>
            <div class="form-group">
                <input type="text" id="new-anime-title" placeholder="Tytuł serialu">
                <input type="text" id="new-anime-category" placeholder="Kategoria (np. Akcja, Romans)">
                <input type="text" id="new-anime-image" placeholder="Link do okładki (URL)">
                <button class="admin-btn" onclick="addAnimeShow()">Dodaj Serial</button>
            </div>
        </div>

        <!-- Dodaj odcinek -->
        <div class="admin-section">
            <h3>Dodaj odcinek do serialu</h3>
            <div class="form-group">
                <select id="ep-anime-select">
                    <option value="">Wybierz serial...</option>
                </select>
                <input type="text" id="ep-number" placeholder="Nazwa/Numer odcinka (np. Odcinek 1)">
                <input type="text" id="ep-link" placeholder="Link do odtwarzacza (URL)">
                <button class="admin-btn" onclick="addEpisode()">Dodaj Odcinek</button>
            </div>
        </div>

        <!-- Edytuj serial -->
        <div class="admin-section">
            <h3>Edytuj istniejący serial</h3>
            <div class="form-group">
                <select id="edit-anime-select" onchange="loadEditData()">
                    <option value="">Wybierz serial do edycji...</option>
                </select>
                <input type="text" id="edit-anime-title" placeholder="Nowy tytuł">
                <input type="text" id="edit-anime-category" placeholder="Nowa kategoria">
                <input type="text" id="edit-anime-image" placeholder="Nowy link do okładki">
                <button class="admin-btn" onclick="updateAnimeShow()">Zapisz zmiany</button>
            </div>
        </div>
    </div>

    <!-- WIDOK KATALOGU -->
    <div id="catalog-view" class="view-section visible">
        <!-- Wyszukiwanie -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="SZUKAJ W KATALOGU..." oninput="filterAnime()">
        </div>

        <!-- Kategorie -->
        <div class="categories" id="categories-container">
            <div class="cat-chip active" onclick="filterCategory('Wszystkie', this)">Wszystkie</div>
            <div class="cat-chip" onclick="filterCategory('Akcja', this)">Akcja</div>
            <div class="cat-chip" onclick="filterCategory('Romans', this)">Romans</div>
            <div class="cat-chip" onclick="filterCategory('Fantasy', this)">Fantasy</div>
            <div class="cat-chip" onclick="filterCategory('Inne', this)">Inne</div>
        </div>

        <!-- Sekcja proponowania odcinków dla użytkowników -->
        <div style="background-color: #16161f; border: 1px solid #22222e; padding: 15px; border-radius: 12px; margin-bottom: 25px;">
            <h3 style="font-size: 15px; margin-bottom: 10px; color: #ff3366;">Zaproponuj / Dodaj odcinek</h3>
            <div class="form-group" style="margin-bottom: 0;">
                <select id="suggest-anime-select">
                    <option value="">Wybierz serial...</option>
                </select>
                <input type="text" id="suggest-ep-title" placeholder="Tytuł / Numer odcinka">
                <input type="text" id="suggest-ep-link" placeholder="Link do odtwarzacza">
                <button class="admin-btn" onclick="suggestEpisode()">Dodaj Odcinek</button>
            </div>
        </div>

        <!-- Siatka z anime -->
        <div class="anime-grid" id="anime-grid">
            <!-- Generowane dynamicznie -->
        </div>
    </div>

    <!-- WIDOK ODTWARZACZA -->
    <div id="player-view" class="view-section hidden">
        <div class="series-header-title" id="player-series-title">Tytuł Serialu</div>
        <div class="player-container">
            <div class="video-frame-wrap">
                <iframe id="main-video-iframe" src="" allowfullscreen></iframe>
            </div>
            <div class="episodes-bar" id="player-episodes-bar">
                <!-- Przyciski odcinków generowane dynamicznie -->
            </div>
            <button class="back-btn" onclick="closePlayer()">← POWRÓT DO KATALOGU</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dmxjcgriqxsxcsvxihed.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRteGpjZ3JpcXhzeGNzdnhpaGVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyOTA1MzAsImV4cCI6MjEwNDg2NjUzMH0.nFoD44in459L7M5mUxSXcojWGP89PbGdhRrTAz8ZbfI';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let allAnimeData = [];
        let currentCategory = 'Wszystkie';

        function toggleDevPanel() {
            const panel = document.getElementById('dev-panel');
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
            } else {
                const pass = prompt('Podaj hasło administratora:');
                if (pass === 'Korneliusz1111') {
                    panel.style.display = 'block';
                    populateSelects();
                } else if (pass !== null) {
                    alert('Błędne hasło!');
                }
            }
        }

        async function fetchAnime() {
            const errorDiv = document.getElementById('error-box');
            const gridDiv = document.getElementById('anime-grid');
            errorDiv.style.display = 'none';
            
            try {
                const { data, error } = await supabaseClient
                    .from('S4muraiPlayer')
                    .select('*');

                if (error) throw error;

                allAnimeData = data || [];
                filterAnime();
                populateSelects();

            } catch (err) {
                console.error(err);
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Błąd pobierania danych:\n' + (err.message || JSON.stringify(err, null, 2));
                gridDiv.innerHTML = '';
            }
        }

        function filterCategory(cat, element) {
            currentCategory = cat;
            document.querySelectorAll('.cat-chip').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            filterAnime();
        }

        function filterAnime() {
            const searchInput = document.getElementById('search-input');
            const searchText = searchInput ? searchInput.value.toLowerCase() : '';
            const gridDiv = document.getElementById('anime-grid');
            
            const filtered = allAnimeData.filter(anime => {
                const matchesCategory = currentCategory === 'Wszystkie' || anime.category === currentCategory;
                const matchesSearch = anime.title && anime.title.toLowerCase().includes(searchText);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                gridDiv.innerHTML = '<p style="color: #888;">Brak seriali spełniających kryteria.</p>';
                return;
            }

            let html = '';
            filtered.forEach(anime => {
                let eps = parseEpisodes(anime.episodes);

                html += `
                    <div class="anime-card" onclick="openPlayer('${anime.id}')">
                        <img src="${anime.image || 'https://via.placeholder.com/240x330?text=Brak+Okladki'}" alt="Okładka">
                        <div class="anime-info">
                            <div class="anime-title">${anime.title}</div>
                            <div class="anime-cat">${anime.category || 'Inne'}</div>
                            <div style="font-size: 12px; color: #888; margin-top: auto;">Odcinków: ${eps.length}</div>
                        </div>
                    </div>
                `;
            });
            gridDiv.innerHTML = html;
        }

        function parseEpisodes(episodesField) {
            try {
                if (Array.isArray(episodesField)) {
                    return episodesField;
                } else if (typeof episodesField === 'string' && episodesField.trim() !== '') {
                    const parsed = JSON.parse(episodesField);
                    if (Array.isArray(parsed)) return parsed;
                }
            } catch(e) {}
            return [];
        }

        // Płynne przełączanie do widoku odtwarzacza
        function openPlayer(animeId) {
            const anime = allAnimeData.find(a => a.id == animeId);
            if (!anime) return;

            const catalogView = document.getElementById('catalog-view');
            const playerView = document.getElementById('player-view');

            catalogView.classList.remove('visible');
            catalogView.classList.add('hidden');

            setTimeout(() => {
                playerView.classList.remove('hidden');
                playerView.classList.add('visible');
                document.getElementById('player-series-title').textContent = anime.title;

                const eps = parseEpisodes(anime.episodes);
                const episodesBar = document.getElementById('player-episodes-bar');
                const iframe = document.getElementById('main-video-iframe');

                if (eps.length === 0) {
                    episodesBar.innerHTML = '<span style="color: #888;">Brak dostępnych odcinków dla tego serialu.</span>';
                    iframe.src = '';
                    return;
                }

                let buttonsHtml = '';
                eps.forEach((ep, index) => {
                    const activeClass = index === 0 ? 'active' : '';
                    buttonsHtml += `<button class="ep-select-btn ${activeClass}" onclick="playEpisode('${ep.link}', this)">${ep.title}</button>`;
                });
                episodesBar.innerHTML = buttonsHtml;

                iframe.src = eps[0].link;
            }, 150);

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function playEpisode(link, btnElement) {
            document.getElementById('main-video-iframe').src = link;
            document.querySelectorAll('.ep-select-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
        }

        // Płynny powrót do katalogu
        function closePlayer() {
            const catalogView = document.getElementById('catalog-view');
            const playerView = document.getElementById('player-view');

            playerView.classList.remove('visible');
            playerView.classList.add('hidden');

            setTimeout(() => {
                document.getElementById('main-video-iframe').src = '';
                catalogView.classList.remove('hidden');
                catalogView.classList.add('visible');
            }, 150);

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function populateSelects() {
            const epSelect = document.getElementById('ep-anime-select');
            const editSelect = document.getElementById('edit-anime-select');
            const suggestSelect = document.getElementById('suggest-anime-select');
            
            let options = '<option value="">Wybierz serial...</option>';
            allAnimeData.forEach(anime => {
                options += `<option value="${anime.id}">${anime.title}</option>`;
            });
            
            if(epSelect) epSelect.innerHTML = options;
            if(editSelect) editSelect.innerHTML = options;
            if(suggestSelect) suggestSelect.innerHTML = options;
        }

        async function addAnimeShow() {
            const title = document.getElementById('new-anime-title').value;
            const category = document.getElementById('new-anime-category').value;
            const image = document.getElementById('new-anime-image').value;

            if (!title) {
                alert('Wprowadź tytuł serialu!');
                return;
            }

            const { error } = await supabaseClient
                .from('S4muraiPlayer')
                .insert([{ title, category, image, episodes: [] }]);

            if (error) {
                alert('Błąd: ' + error.message);
            } else {
                alert('Serial dodany pomyślnie!');
                document.getElementById('new-anime-title').value = '';
                document.getElementById('new-anime-image').value = '';
                fetchAnime();
            }
        }

        async function addEpisode() {
            const animeId = document.getElementById('ep-anime-select').value;
            const epTitle = document.getElementById('ep-number').value;
            const epLink = document.getElementById('ep-link').value;

            if (!animeId || !epTitle || !epLink) {
                alert('Wypełnij wszystkie pola odcinka!');
                return;
            }

            await saveEpisodeToDatabase(animeId, epTitle, epLink, 'Odcinek dodany pomyślnie!');
            document.getElementById('ep-number').value = '';
            document.getElementById('ep-link').value = '';
        }

        async function suggestEpisode() {
            const animeId = document.getElementById('suggest-anime-select').value;
            const epTitle = document.getElementById('suggest-ep-title').value;
            const epLink = document.getElementById('suggest-ep-link').value;

            if (!animeId || !epTitle || !epLink) {
                alert('Musisz wybrać serial, podać nazwę odcinka ORAZ dołączyć link do odtwarzacza!');
                return;
            }

            await saveEpisodeToDatabase(animeId, epTitle, epLink, 'Twoja propozycja odcinka została dodana pomyślnie!');
            document.getElementById('suggest-ep-title').value = '';
            document.getElementById('suggest-ep-link').value = '';
        }

        async function saveEpisodeToDatabase(animeId, epTitle, epLink, successMessage) {
            const animeObj = allAnimeData.find(a => a.id == animeId);
            if (!animeObj) {
                alert('Błąd: Nie znaleziono takiego serialu w pamięci!');
                return;
            }

            let eps = parseEpisodes(animeObj.episodes);
            eps.push({ title: epTitle, link: epLink });

            const { error } = await supabaseClient
                .from('S4muraiPlayer')
                .update({ episodes: eps })
                .eq('id', animeId);

            if (error) {
                alert('Błąd zapisu odcinka w bazie Supabase: ' + error.message);
            } else {
                alert(successMessage);
                await fetchAnime();
            }
        }

        function loadEditData() {
            const animeId = document.getElementById('edit-anime-select').value;
            if (!animeId) {
                document.getElementById('edit-anime-title').value = '';
                document.getElementById('edit-anime-image').value = '';
                return;
            }
            const animeObj = allAnimeData.find(a => a.id == animeId);
            if (animeObj) {
                document.getElementById('edit-anime-title').value = animeObj.title || '';
                document.getElementById('edit-anime-image').value = animeObj.image || '';
                document.getElementById('edit-anime-category').value = animeObj.category || 'Inne';
            }
        }

        async function updateAnimeShow() {
            const targetId = document.getElementById('edit-anime-select').value;
            const newTitle = document.getElementById('edit-anime-title').value;
            const newImage = document.getElementById('edit-anime-image').value;
            const newCat = document.getElementById('edit-anime-category').value;

            if (!targetId || !newTitle) {
                alert('Wybierz serial i podaj tytuł!');
                return;
            }

            const { error } = await supabaseClient
                .from('S4muraiPlayer')
                .update({ title: newTitle, image: newImage, category: newCat })
                .eq('id', targetId);

            if (error) {
                alert('Błąd edycji: ' + error.message);
            } else {
                alert('Serial zaktualizowany pomyślnie!');
                fetchAnime();
            }
        }

        fetchAnime();
    </script>
</body>
</html>
