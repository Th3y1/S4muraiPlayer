<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S4muraiPlayer</title>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #070709;
            color: #f1f1f1;
            margin: 0;
            padding: 25px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff1e38;
            padding-bottom: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(255, 30, 56, 0.15);
        }
        h1 {
            color: #ff1e38;
            margin: 0;
            font-size: 34px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 30, 56, 0.6);
        }
        .header-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .dev-btn, .discord-btn {
            background: #121218;
            color: #fff;
            border: 1px solid #ff1e38;
            padding: 10px 20px;
            border-radius: 0px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            font-size: 14px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 30, 56, 0.2);
        }
        .dev-btn:hover {
            background: #ff1e38;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 30, 56, 0.8);
        }
        .discord-btn {
            background: #5865F2;
            border-color: #5865F2;
            box-shadow: 0 0 10px rgba(88, 101, 242, 0.3);
        }
        .discord-btn:hover {
            background: #4752C4;
            border-color: #4752C4;
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.7);
        }
        /* Panel Dev */
        #dev-panel {
            display: none;
            background: #0e0e13;
            padding: 25px;
            border-radius: 0px;
            box-shadow: inset 0 0 15px rgba(255, 30, 56, 0.15), 0 8px 30px rgba(0,0,0,0.9);
            margin-bottom: 35px;
            border: 2px solid #ff1e38;
        }
        .admin-section {
            background: #14141c;
            padding: 18px;
            margin-top: 15px;
            border-radius: 0px;
            border: 1px solid #ff1e38;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #09090d;
            border: 1px solid #3a1c22;
            color: #fff;
            border-radius: 0px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #ff1e38;
            box-shadow: 0 0 8px rgba(255, 30, 56, 0.4);
        }
        button.action-btn {
            width: 100%;
            padding: 12px;
            background: #ff1e38;
            color: white;
            border: none;
            border-radius: 0px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button.action-btn:hover {
            background: #d61128;
            box-shadow: 0 0 15px rgba(255, 30, 56, 0.7);
        }
        /* Pasek Wyszukiwania i Kategorii */
        .controls-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }
        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px 18px;
            background: #0e0e13;
            border: 1px solid #2a1015;
            color: #fff;
            font-size: 14px;
            border-radius: 0px;
            outline: none;
            transition: 0.2s;
        }
        .search-box:focus {
            border-color: #ff1e38;
            box-shadow: 0 0 10px rgba(255, 30, 56, 0.3);
        }
        .categories-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .cat-chip {
            background: #0e0e13;
            border: 1px solid #2a1015;
            color: #a0a0b0;
            padding: 10px 18px;
            border-radius: 0px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .cat-chip:hover, .cat-chip.active {
            background: #ff1e38;
            border-color: #ff1e38;
            color: #fff;
            box-shadow: 0 0 12px rgba(255, 30, 56, 0.5);
        }
        /* Sekcja Propozycji Odcinka */
        .suggest-section {
            background: #0e0e13;
            border: 2px solid #2a1015;
            padding: 20px;
            margin-bottom: 35px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
        }
        .suggest-section h3 {
            margin-top: 0;
            color: #ff1e38;
            text-transform: uppercase;
            font-size: 16px;
            letter-spacing: 1px;
        }
        .suggest-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        @media(max-width: 768px) {
            .suggest-grid { grid-template-columns: 1fr; }
        }
        /* Siatka Anime */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
            padding-top: 15px;
        }
        .anime-card {
            background: #0e0e13;
            border-radius: 0px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            border: 1px solid #220c11;
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.25s ease, border-color 0.25s ease;
        }
        .anime-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 35px rgba(255, 30, 56, 0.4);
            border-color: #ff1e38;
        }
        .anime-card img {
            width: 100%;
            height: 330px;
            object-fit: cover;
            filter: contrast(1.05);
            transition: filter 0.3s ease, transform 0.3s ease;
        }
        .anime-card:hover img {
            filter: brightness(1.15) contrast(1.1);
            transform: scale(1.03);
        }
        .anime-info {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .anime-title {
            font-size: 17px;
            font-weight: bold;
            margin: 0 0 6px 0;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .anime-cat {
            color: #ff1e38;
            font-size: 11px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }
        .episodes-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: auto;
            max-height: 100px;
            overflow-y: auto;
            padding-right: 2px;
        }
        .episodes-list::-webkit-scrollbar {
            width: 4px;
        }
        .episodes-list::-webkit-scrollbar-thumb {
            background: #ff1e38;
            border-radius: 0px;
        }
        .ep-btn {
            background: #14141c;
            color: #d0d0e0;
            padding: 6px 10px;
            border-radius: 0px;
            text-decoration: none;
            font-size: 12px;
            border: 1px solid #2e1016;
            transition: 0.2s;
        }
        .ep-btn:hover {
            background: #ff1e38;
            color: #fff;
            border-color: #ff1e38;
            box-shadow: 0 0 8px rgba(255, 30, 56, 0.6);
        }
        #error-msg {
            color: #ff5555;
            background: #1f0808;
            border: 1px solid #661a1a;
            padding: 12px;
            border-radius: 0px;
            margin-bottom: 20px;
            white-space: pre-wrap;
            font-family: monospace;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>S4muraiPlayer</h1>
        <div class="header-buttons">
            <a href="https://discord.gg/M6uy839mk" target="_blank" class="discord-btn">Discord</a>
            <button class="dev-btn" onclick="toggleDevPanel()">Dev Panel</button>
        </div>
    </header>

    <div id="error-msg"></div>

    <!-- PANEL ADMINISTRATORA (DEV) -->
    <div id="dev-panel">
        <h2>Panel Zarządzania (Dev)</h2>
        
        <div class="admin-section">
            <h3>Dodaj Nowy Serial</h3>
            <input type="text" id="new-anime-title" placeholder="Tytuł serialu (np. Solo Leveling)">
            <select id="new-anime-category">
                <option value="Akcja">Akcja</option>
                <option value="Romans">Romans</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Inne">Inne</option>
            </select>
            <input type="text" id="new-anime-image" placeholder="Link do okładki (URL obrazka)">
            <button class="action-btn" onclick="addAnimeShow()">Utwórz Serial</button>
        </div>

        <div class="admin-section">
            <h3>Dodaj Odcinek do Serialu</h3>
            <select id="ep-anime-select">
                <option value="">Wybierz serial...</option>
            </select>
            <input type="text" id="ep-number" placeholder="Numer lub nazwa odcinka (np. Odcinek 1)">
            <input type="text" id="ep-link" placeholder="Link do odtwarzacza / wideo">
            <button class="action-btn" onclick="addEpisode()">Dodaj Odcinek</button>
        </div>

        <div class="admin-section">
            <h3>Edytuj Istniejący Serial</h3>
            <select id="edit-anime-select" onchange="loadEditData()">
                <option value="">Wybierz serial do edycji...</option>
            </select>
            <input type="text" id="edit-anime-title" placeholder="Nowy tytuł">
            <select id="edit-anime-category">
                <option value="Akcja">Akcja</option>
                <option value="Romans">Romans</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Inne">Inne</option>
            </select>
            <input type="text" id="edit-anime-image" placeholder="Nowy link do okładki">
            <button class="action-btn" onclick="updateAnimeShow()">Zapisz Zmiany</button>
        </div>
    </div>

    <!-- Pasek Wyszukiwania i Kategorii -->
    <div class="controls-bar">
        <input type="text" id="search-input" class="search-box" placeholder="Szukaj anime..." oninput="filterAnime()">
        <div class="categories-bar">
            <button class="cat-chip active" onclick="filterCategory('Wszystkie', this)">Wszystkie</button>
            <button class="cat-chip" onclick="filterCategory('Akcja', this)">Akcja</button>
            <button class="cat-chip" onclick="filterCategory('Romans', this)">Romans</button>
            <button class="cat-chip" onclick="filterCategory('Fantasy', this)">Fantasy</button>
            <button class="cat-chip" onclick="filterCategory('Inne', this)">Inne</button>
        </div>
    </div>

    <!-- Sekcja Propozycji Odcinka (Wymaga Odtwarzacza/Linku) -->
    <div class="suggest-section">
        <h3>Zaproponuj / Dodaj Odcinek</h3>
        <p style="font-size: 13px; color: #aaa; margin-top: 5px;">Chcesz dodać odcinek do wybranego serialu? Wybierz tytuł, wpisz numer oraz podaj link do odtwarzacza (wymagane).</p>
        <div class="suggest-grid">
            <select id="suggest-anime-select">
                <option value="">Wybierz serial...</option>
            </select>
            <input type="text" id="suggest-ep-title" placeholder="Nazwa/Numer odcinka (np. Odcinek 5)">
            <input type="text" id="suggest-ep-link" placeholder="Link do odtwarzacza (URL)">
        </div>
        <button class="action-btn" style="margin-top: 12px;" onclick="suggestEpisode()">Wyślij Propozycję Odcinka</button>
    </div>

    <!-- Katalog Anime -->
    <div>
        <div id="anime-grid" class="anime-grid">Ładowanie katalogu...</div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://dmxjcgriqxsxcsvxihed.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRteGpjZ3JpcXhzeGNzdnhpaGVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyOTA1MzAsImV4cCI6MjEwNDg2NjUzMH0.nFoD44in459L7M5mUxSXcojWGP89PbGdhRrTAz8ZbfI';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let allAnimeData = [];
    let currentCategory = 'Wszystkie';

    function toggleDevPanel() {
        const panel = document.getElementById('dev-panel');
        if (panel.style.display === 'block') {
            panel.style.display = 'none';
        } else {
            const pass = prompt('Podaj hasło administratora:');
            if (pass === 'Korneliusz1111') {
                panel.style.display = 'block';
                populateSelects();
            } else if (pass !== null) {
                alert('Błędne hasło!');
            }
        }
    }

    async function fetchAnime() {
        const errorDiv = document.getElementById('error-msg');
        const gridDiv = document.getElementById('anime-grid');
        errorDiv.style.display = 'none';
        
        try {
            const { data, error } = await supabaseClient
                .from('S4muraiPlayer')
                .select('*');

            if (error) throw error;

            allAnimeData = data || [];
            filterAnime();
            populateSelects();

        } catch (err) {
            console.error(err);
            errorDiv.style.display = 'block';
            errorDiv.textContent = 'Błąd pobierania danych:\n' + (err.message || JSON.stringify(err, null, 2));
            gridDiv.innerHTML = '';
        }
    }

    function filterCategory(cat, element) {
        currentCategory = cat;
        document.querySelectorAll('.cat-chip').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        filterAnime();
    }

    function filterAnime() {
        const searchInput = document.getElementById('search-input');
        const searchText = searchInput ? searchInput.value.toLowerCase() : '';
        const gridDiv = document.getElementById('anime-grid');
        
        const filtered = allAnimeData.filter(anime => {
            const matchesCategory = currentCategory === 'Wszystkie' || anime.category === currentCategory;
            const matchesSearch = anime.title && anime.title.toLowerCase().includes(searchText);
            return matchesCategory && matchesSearch;
        });

        if (filtered.length === 0) {
            gridDiv.innerHTML = '<p style="color: #888;">Brak seriali spełniających kryteria.</p>';
            return;
        }

        let html = '';
        filtered.forEach(anime => {
            let eps = [];
            try {
                if (Array.isArray(anime.episodes)) {
                    eps = anime.episodes;
                } else if (typeof anime.episodes === 'string' && anime.episodes.trim() !== '') {
                    const parsed = JSON.parse(anime.episodes);
                    if (Array.isArray(parsed)) eps = parsed;
                }
            } catch(e) {
                eps = [];
            }

            let episodesHtml = '';
            if (eps.length === 0) {
                episodesHtml = '<span style="color: #555566; font-size: 12px;">Brak odcinków</span>';
            } else {
                eps.forEach(ep => {
                    if (ep && ep.title && ep.link) {
                        episodesHtml += `<a href="${ep.link}" target="_blank" class="ep-btn">${ep.title}</a>`;
                    }
                });
            }

            html += `
                <div class="anime-card">
                    <img src="${anime.image || 'https://via.placeholder.com/240x330?text=Brak+Okladki'}" alt="Okładka">
                    <div class="anime-info">
                        <div class="anime-title">${anime.title}</div>
                        <div class="anime-cat">${anime.category || 'Inne'}</div>
                        <div class="episodes-list">
                            ${episodesHtml}
                        </div>
                    </div>
                </div>
            `;
        });
        gridDiv.innerHTML = html;
    }

    function populateSelects() {
        const epSelect = document.getElementById('ep-anime-select');
        const editSelect = document.getElementById('edit-anime-select');
        const suggestSelect = document.getElementById('suggest-anime-select');
        
        let options = '<option value="">Wybierz serial...</option>';
        allAnimeData.forEach(anime => {
            options += `<option value="${anime.id}">${anime.title}</option>`;
        });
        
        if(epSelect) epSelect.innerHTML = options;
        if(editSelect) editSelect.innerHTML = options;
        if(suggestSelect) suggestSelect.innerHTML = options;
    }

    async function addAnimeShow() {
        const title = document.getElementById('new-anime-title').value;
        const category = document.getElementById('new-anime-category').value;
        const image = document.getElementById('new-anime-image').value;

        if (!title) {
            alert('Wprowadź tytuł serialu!');
            return;
        }

        const { error } = await supabaseClient
            .from('S4muraiPlayer')
            .insert([{ title, category, image, episodes: [] }]);

        if (error) {
            alert('Błąd: ' + error.message);
        } else {
            alert('Serial dodany pomyślnie!');
            document.getElementById('new-anime-title').value = '';
            document.getElementById('new-anime-image').value = '';
            fetchAnime();
        }
    }

    async function addEpisode() {
        const animeId = document.getElementById('ep-anime-select').value;
        const epTitle = document.getElementById('ep-number').value;
        const epLink = document.getElementById('ep-link').value;

        if (!animeId || !epTitle || !epLink) {
            alert('Wypełnij wszystkie pola odcinka!');
            return;
        }

        await saveEpisodeToDatabase(animeId, epTitle, epLink, 'Odcinek dodany pomyślnie!');
        document.getElementById('ep-number').value = '';
        document.getElementById('ep-link').value = '';
    }

    async function suggestEpisode() {
        const animeId = document.getElementById('suggest-anime-select').value;
        const epTitle = document.getElementById('suggest-ep-title').value;
        const epLink = document.getElementById('suggest-ep-link').value;

        if (!animeId || !epTitle || !epLink) {
            alert('Musisz wybrać serial, podać nazwę odcinka ORAZ dołączyć link do odtwarzacza!');
            return;
        }

        await saveEpisodeToDatabase(animeId, epTitle, epLink, 'Twoja propozycja odcinka z odtwarzaczem została dodana pomyślnie!');
        document.getElementById('suggest-ep-title').value = '';
        document.getElementById('suggest-ep-link').value = '';
    }

    async function saveEpisodeToDatabase(animeId, epTitle, epLink, successMessage) {
        const animeObj = allAnimeData.find(a => a.id == animeId);
        if (!animeObj) return;

        let eps = [];
        try {
            if (Array.isArray(animeObj.episodes)) {
                eps = animeObj.episodes;
            } else if (typeof animeObj.episodes === 'string' && animeObj.episodes.trim() !== '') {
                const parsed = JSON.parse(animeObj.episodes);
                if (Array.isArray(parsed)) eps = parsed;
            }
        } catch(e) { eps = []; }

        eps.push({ title: epTitle, link: epLink });

        const { error } = await supabaseClient
            .from('S4muraiPlayer')
            .update({ episodes: eps })
            .eq('id', animeId);

        if (error) {
            alert('Błąd zapisu odcinka: ' + error.message);
        } else {
            alert(successMessage);
            fetchAnime();
        }
    }

    function loadEditData() {
        const animeId = document.getElementById('edit-anime-select').value;
        if (!animeId) {
            document.getElementById('edit-anime-title').value = '';
            document.getElementById('edit-anime-image').value = '';
            return;
        }
        const animeObj = allAnimeData.find(a => a.id == animeId);
        if (animeObj) {
            document.getElementById('edit-anime-title').value = animeObj.title || '';
            document.getElementById('edit-anime-image').value = animeObj.image || '';
            document.getElementById('edit-anime-category').value = animeObj.category || 'Inne';
        }
    }

    async function updateAnimeShow() {
        const targetId = document.getElementById('edit-anime-select').value;
        const newTitle = document.getElementById('edit-anime-title').value;
        const newImage = document.getElementById('edit-anime-image').value;
        const newCat = document.getElementById('edit-anime-category').value;

        if (!targetId || !newTitle) {
            alert('Wybierz serial i podaj tytuł!');
            return;
        }

        const { error } = await supabaseClient
            .from('S4muraiPlayer')
            .update({ title: newTitle, image: newImage, category: newCat })
            .eq('id', targetId);

        if (error) {
            alert('Błąd edycji: ' + error.message);
        } else {
            alert('Serial zaktualizowany pomyślnie!');
            fetchAnime();
        }
    }

    fetchAnime();
</script>

</body>
</html>
