<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S4muraiPlayer</title>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #222;
            padding-bottom: 15px;
            margin-bottom: 30px;
            position: relative;
        }
        header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 150px;
            height: 2px;
            background: #e50914;
        }
        .logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
        }
        .logo span {
            color: #e50914;
            display: block;
            font-size: 20px;
            margin-top: -5px;
        }
        .header-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .discord-btn {
            background: #5865F2;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .admin-toggle-btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
        }
        .admin-toggle-btn:hover {
            background: #b20710;
        }
        /* Panel Administratora (ukryty domyślnie) */
        #admin-panel {
            display: none;
            background: #161616;
            border: 1px solid #333;
            border-left: 4px solid #e50914;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 30px;
        }
        .admin-section {
            background: #1f1f1f;
            padding: 15px;
            margin-top: 15px;
            border-radius: 4px;
        }
        .admin-section h3 {
            margin-top: 0;
            color: #e50914;
            font-size: 16px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #121212;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button.submit-btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
            text-transform: uppercase;
        }
        button.submit-btn:hover {
            background: #b20710;
        }
        /* Wyszukiwarka i kategorie */
        .search-bar {
            width: 100%;
            padding: 14px 20px;
            background: #161616;
            border: 1px solid #333;
            color: white;
            border-radius: 4px;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .categories {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .cat-btn {
            background: #161616;
            border: 1px solid #333;
            color: #bbb;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }
        .cat-btn:hover, .cat-btn.active {
            background: #e50914;
            color: white;
            border-color: #e50914;
        }
        /* Katalog Siatka */
        .catalog-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            border-left: 3px solid #e50914;
            padding-left: 10px;
        }
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .anime-card {
            background: #161616;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #222;
            display: flex;
            flex-direction: column;
        }
        .anime-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }
        .anime-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .anime-name {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .anime-genre {
            font-size: 12px;
            color: #777;
            margin-bottom: 10px;
        }
        .episodes-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: auto;
            max-height: 80px;
            overflow-y: auto;
        }
        .ep-link {
            background: #222;
            color: #eee;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 3px;
            text-decoration: none;
        }
        .ep-link:hover {
            background: #e50914;
            color: white;
        }
        #error-msg {
            color: #ff5555;
            background: #2a1111;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">
            S4MURAI
            <span>PLAYER</span>
        </div>
        <div class="header-right">
            <a href="https://discord.com" target="_blank" class="discord-btn">DISCORD</a>
            <button class="admin-toggle-btn" onclick="toggleAdminPanel()">Panel Admina</button>
        </div>
    </header>

    <div id="error-msg"></div>

    <!-- PANEL ADMINA (Zabezpieczony hasłem) -->
    <div id="admin-panel">
        <h2 style="margin-top:0; color:#fff;">Panel Zarządzania S4muraiPlayer</h2>
        
        <!-- 1. Dodawanie serialu -->
        <div class="admin-section">
            <h3>1. Dodaj Nowy Serial Anime</h3>
            <input type="text" id="add-title" placeholder="Tytuł anime...">
            <select id="add-category">
                <option value="Akcja">Akcja</option>
                <option value="Romans">Romans</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Inne">Inne</option>
            </select>
            <input type="text" id="add-image" placeholder="Link do okładki (URL obrazka)...">
            <button class="submit-btn" onclick="createNewAnime()">Utwórz Serial</button>
        </div>

        <!-- 2. Dodawanie odcinka -->
        <div class="admin-section">
            <h3>2. Dodaj Odcinek do Serialu</h3>
            <select id="ep-anime-select">
                <option value="">Wybierz serial...</option>
            </select>
            <input type="text" id="ep-title" placeholder="Nazwa/Numer odcinka (np. Odcinek 1)">
            <input type="text" id="ep-link" placeholder="Link do odtwarzacza / wideo...">
            <button class="submit-btn" onclick="addNewEpisode()">Dodaj Odcinek</button>
        </div>

        <!-- 3. Edycja serialu (Nazwa, okładka, kategoria) -->
        <div class="admin-section">
            <h3>3. Edytuj Istniejący Serial (Nazwa, Okładka, Kategoria)</h3>
            <select id="edit-anime-select" onchange="loadEditForm()">
                <option value="">Wybierz serial do edycji...</option>
            </select>
            <input type="text" id="edit-title" placeholder="Nowy tytuł...">
            <select id="edit-category">
                <option value="Akcja">Akcja</option>
                <option value="Romans">Romans</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Inne">Inne</option>
            </select>
            <input type="text" id="edit-image" placeholder="Nowy link do okładki...">
            <button class="submit-btn" onclick="updateAnimeData()">Zapisz Zmiany</button>
        </div>
    </div>

    <!-- Wyszukiwarka -->
    <input type="text" id="search-input" class="search-bar" placeholder="SZUKAJ W KATALOGU..." oninput="filterCatalog()">

    <!-- Kategorie -->
    <div class="categories">
        <button class="cat-btn active" onclick="setCategory('Wszystkie', this)">Wszystkie</button>
        <button class="cat-btn" onclick="setCategory('Akcja', this)">Akcja</button>
        <button class="cat-btn" onclick="setCategory('Romans', this)">Romans</button>
        <button class="cat-btn" onclick="setCategory('Fantasy', this)">Fantasy</button>
        <button class="cat-btn" onclick="setCategory('Inne', this)">Inne</button>
    </div>

    <!-- Katalog -->
    <div class="catalog-title">KATALOG SERII ANIME</div>
    <div id="anime-grid" class="anime-grid">Ładowanie bazy danych...</div>
</div>

<script>
    const SUPABASE_URL = 'https://dmxjcgriqxsxcsvxihed.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRteGpjZ3JpcXhzeGNzdnhpaGVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyOTA1MzAsImV4cCI6MjEwNDg2NjUzMH0.nFoD44in459L7M5mUxSXcojWGP89PbGdhRrTAz8ZbfI';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let animeList = [];
    let activeCategory = 'Wszystkie';

    // Pokazywanie/ukrywanie panelu admina na hasło
    function toggleAdminPanel() {
        const panel = document.getElementById('admin-panel');
        if (panel.style.display === 'block') {
            panel.style.display = 'none';
        } else {
            const pass = prompt('Podaj hasło administratora:');
            if (pass === 'Korneliusz1111') {
                panel.style.display = 'block';
                populateDropdowns();
            } else if (pass !== null) {
                alert('Błędne hasło!');
            }
        }
    }

    // Pobieranie danych z Supabase
    async function fetchAnimeData() {
        const errDiv = document.getElementById('error-msg');
        errDiv.style.display = 'none';

        try {
            const { data, error } = await supabaseClient
                .from('S4muraiPlayer')
                .select('*');

            if (error) throw error;

            animeList = data || [];
            renderCatalog();
            populateDropdowns();
        } catch (err) {
            console.error(err);
            errDiv.style.display = 'block';
            errDiv.textContent = 'Błąd pobierania bazy danych:\n' + JSON.stringify(err, null, 2);
        }
    }

    // Rysowanie katalogu
    function renderCatalog() {
        const grid = document.getElementById('anime-grid');
        const searchTerm = document.getElementById('search-input').value.toLowerCase();

        let filtered = animeList.filter(anime => {
            const matchesCat = (activeCategory === 'Wszystkie' || anime.category === activeCategory);
            const matchesSearch = anime.title && anime.title.toLowerCase().includes(searchTerm);
            return matchesCat && matchesSearch;
        });

        if (filtered.length === 0) {
            grid.innerHTML = '<p style="color: #666;">Brak pozycji w bazie.</p>';
            return;
        }

        let html = '';
        filtered.forEach(anime => {
            let episodes = [];
            try {
                episodes = typeof anime.episodes === 'string' ? JSON.parse(anime.episodes) : (anime.episodes || []);
            } catch(e) { episodes = []; }

            let epsHtml = '';
            if (episodes.length === 0) {
                epsHtml = '<span style="color:#555; font-size:11px;">Brak odcinków</span>';
            } else {
                episodes.forEach(ep => {
                    epsHtml += `<a href="${ep.link}" target="_blank" class="ep-link">${ep.title}</a>`;
                });
            }

            html += `
                <div class="anime-card">
                    <img src="${anime.image || 'https://via.placeholder.com/200x280?text=Brak+Okładki'}" alt="Okładka">
                    <div class="anime-info">
                        <div class="anime-name" title="${anime.title}">${anime.title}</div>
                        <div class="anime-genre">${anime.category || 'Inne'}</div>
                        <div class="episodes-container">
                            ${epsHtml}
                        </div>
                    </div>
                </div>
            `;
        });
        grid.innerHTML = html;
    }

    function setCategory(cat, btn) {
        activeCategory = cat;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderCatalog();
    }

    function filterCatalog() {
        renderCatalog();
    }

    function populateDropdowns() {
        const epSelect = document.getElementById('ep-anime-select');
        const editSelect = document.getElementById('edit-anime-select');

        let options = '<option value="">Wybierz serial...</option>';
        animeList.forEach(anime => {
            options += `<option value="${anime.id}">${anime.title}</option>`;
        });

        epSelect.innerHTML = options;
        editSelect.innerHTML = options;
    }

    // 1. Dodawanie nowego serialu
    async function createNewAnime() {
        const title = document.getElementById('add-title').value;
        const category = document.getElementById('add-category').value;
        const image = document.getElementById('add-image').value;

        if (!title) {
            alert('Wpisz tytuł serialu!');
            return;
        }

        const { error } = await supabaseClient
            .from('S4muraiPlayer')
            .insert([{ title, category, image, episodes: [] }]);

        if (error) {
            alert('Błąd: ' + error.message);
        } else {
            alert('Serial dodany pomyślnie!');
            document.getElementById('add-title').value = '';
            document.getElementById('add-image').value = '';
            fetchAnimeData();
        }
    }

    // 2. Dodawanie odcinka do wybranego serialu
    async function addNewEpisode() {
        const animeId = document.getElementById('ep-anime-select').value;
        const epTitle = document.getElementById('ep-title').value;
        const epLink = document.getElementById('ep-link').value;

        if (!animeId || !epTitle || !epLink) {
            alert('Wypełnij wszystkie pola odcinka!');
            return;
        }

        const animeObj = animeList.find(a => a.id == animeId);
        if (!animeObj) return;

        let eps = [];
        try {
            eps = typeof animeObj.episodes === 'string' ? JSON.parse(animeObj.episodes) : (animeObj.episodes || []);
        } catch(e) { eps = []; }

        eps.push({ title: epTitle, link: epLink });

        const { error } = await supabaseClient
            .from('S4muraiPlayer')
            .update({ episodes: eps })
            .eq('id', animeId);

        if (error) {
            alert('Błąd dodawania odcinka: ' + error.message);
        } else {
            alert('Odcinek dodany pomyślnie!');
            document.getElementById('ep-title').value = '';
            document.getElementById('ep-link').value = '';
            fetchAnimeData();
        }
    }

    // Ładowanie danych do formularza edycji
    function loadEditForm() {
        const animeId = document.getElementById('edit-anime-select').value;
        if (!animeId) {
            document.getElementById('edit-title').value = '';
            document.getElementById('edit-image').value = '';
            return;
        }
        const animeObj = animeList.find(a => a.id == animeId);
        if (animeObj) {
            document.getElementById('edit-title').value = animeObj.title || '';
            document.getElementById('edit-image').value = animeObj.image || '';
            document.getElementById('edit-category').value = animeObj.category || 'Inne';
        }
    }

    // 3. Edycja serialu
    async function updateAnimeData() {
        const animeId = document.getElementById('edit-anime-select').value;
        const newTitle = document.getElementById('edit-title').value;
        const newCategory = document.getElementById('edit-category').value;
        const newImage = document.getElementById('edit-image').value;

        if (!animeId || !newTitle) {
            alert('Wybierz serial i podaj tytuł!');
            return;
        }

        const { error } = await supabaseClient
            .from('S4muraiPlayer')
            .update({ title: newTitle, category: newCategory, image: newImage })
            .eq('id', animeId);

        if (error) {
            alert('Błąd edycji: ' + error.message);
        } else {
            alert('Zaktualizowano pomyślnie!');
            fetchAnimeData();
        }
    }

    // Start
    fetchAnimeData();
</script>

</body>
</html>
